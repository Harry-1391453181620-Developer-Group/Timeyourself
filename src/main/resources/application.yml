server:
  address: 127.0.0.1
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: Time-Yourself
  datasource:
    url: jdbc:sqlite:${timeyourself.data-dir:./data}/timeyourself.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys = ON

logging:
  file:
    name: ${timeyourself.data-dir:./data}/timeyourself.log
  level:
    root: INFO

timeyourself:
  security:
    host-guard: true
