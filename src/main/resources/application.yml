server:
  # 只监听本机：macOS 不会弹防火墙授权，Ubuntu 也不会暴露到局域网
  address: 127.0.0.1
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: Time-Yourself
  datasource:
    # timeyourself.data-dir 由 TimeYourselfApplication 在启动前设置：
    # macOS  ~/Library/Application Support/TimeYourself
    # Ubuntu $XDG_DATA_HOME/timeyourself（默认 ~/.local/share/timeyourself）
    # Windows ./data
    url: jdbc:sqlite:${timeyourself.data-dir:./data}/timeyourself.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys = ON

logging:
  file:
    name: ${timeyourself.data-dir:./data}/timeyourself.log
  level:
    root: INFO

timeyourself:
  security:
    # 只接受 localhost / 127.0.0.1 / ::1 的 Host 头，防止 DNS rebinding。
    # 如确实需要通过主机名访问，再改为 false。
    host-guard: true
