name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

# If you push twice quickly, cancel the older build and keep the newest one.
concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon (arm64)
            arch: arm64
          - os: macos-15-intel    # Intel (x86_64)
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Show toolchain
        run: |
          set -euo pipefail
          uname -m
          java -version
          mvn -version

      - name: Build .app and .dmg
        run: |
          set -euo pipefail
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh

      - name: Verify app signature and libjli entitlements
        run: |
          set -euo pipefail
          APP="build/macos/TimeYourself.app"
          test -d "$APP"
          test -f "$APP/Contents/runtime/Contents/Home/lib/libjli.dylib"

          echo "== app signature =="
          codesign --verify --strict --verbose=4 "$APP"

          echo "== launcher signature =="
          codesign --verify --strict --verbose=4 "$APP/Contents/MacOS/TimeYourself"

          echo "== bundled JDK libjli signature =="
          # Vendor runtime signatures are outside our control; log, but do not
          # block the build on this one. The entitlement check below is the
          # important guard for the libjli Team ID failure.
          codesign --verify --strict --verbose=4 \
            "$APP/Contents/runtime/Contents/Home/lib/libjli.dylib" \
            || echo "WARN: libjli vendor signature verification failed; continuing"

          echo "== launcher entitlements =="
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)"
          if ! echo "$ENTITLEMENTS" | grep -q "com.apple.security.cs.disable-library-validation"; then
            ENTITLEMENTS="$(codesign -d --entitlements :- \
              "$APP/Contents/MacOS/TimeYourself" 2>/dev/null || true)"
          fi
          echo "$ENTITLEMENTS"
          echo "$ENTITLEMENTS" | grep -q "com.apple.security.cs.disable-library-validation"

      - name: Verify DMG
        run: |
          set -euo pipefail
          ls -lh build/macos/*.dmg
          hdiutil verify build/macos/*.dmg

      - name: Write build info
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_RUN: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          {
            echo "app=TimeYourself"
            echo "version=2.0.0"
            echo "arch=$BUILD_ARCH"
            echo "commit=$BUILD_SHA"
            echo "ref=$BUILD_REF"
            echo "run=$BUILD_RUN"
            echo "attempt=$BUILD_ATTEMPT"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee build/macos/build-info.txt
          {
            echo "### TimeYourself macOS $BUILD_ARCH"
            echo '```'
            cat build/macos/build-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: TimeYourself-macOS-${{ matrix.arch }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            build/macos/*.dmg
            build/macos/build-info.txt
          if-no-files-found: error
          retention-days: 14
